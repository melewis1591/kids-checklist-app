<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7956d8"><title>Morning Missions</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:ui-rounded,system-ui,-apple-system,sans-serif;color:#29263d;background:#f8f6ff}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}main{max-width:760px;margin:auto;padding:22px 16px 80px}.card{background:white;border-radius:22px;padding:20px;box-shadow:0 7px 24px #44346b13;margin:14px 0}.muted{color:#69657c}.pill{border-radius:999px;background:#eee8ff;padding:7px 12px;font-weight:700;display:inline-block}.primary{border:0;background:#7956d8;color:white;border-radius:14px;padding:13px 17px;font-weight:800}.secondary{border:1px solid #ddd4f6;background:white;border-radius:14px;padding:11px}.task{display:flex;align-items:center;gap:12px;width:100%;padding:16px;border:2px solid #ece7f6;border-radius:18px;background:white;margin:10px 0;text-align:left;font-weight:750;font-size:18px}.task.done{background:#eaf9f1;border-color:#5acb91}.task .emoji{font-size:30px}.task .check{margin-left:auto;font-size:25px}.bar{height:15px;background:#eee9fa;border-radius:99px;overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,#9c77ff,#fc83bd);transition:width .2s}.big{font-size:32px;font-weight:900}.norah{background:linear-gradient(150deg,#fff4fb,#f4f4ff)}.vinny{background:linear-gradient(150deg,#e8f1ff,#f4f9ff)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{padding:16px;border-radius:18px;background:#f5f1ff}.error{color:#a31538;white-space:pre-wrap}.success{color:#146c43}input,select{width:100%;padding:13px;border:1px solid #c9c2dc;border-radius:12px;margin:6px 0 14px}label{font-weight:700}header{display:flex;justify-content:space-between;align-items:center;gap:8px}h1{font-size:29px;margin:10px 0}h2{margin:0 0 12px}small{color:#777} .hidden{display:none}.reward{font-size:22px} .childrow{border:1px solid #e6dff5;border-radius:18px;padding:16px;margin:12px 0} .right{margin-left:auto}.wrap{display:flex;gap:8px;flex-wrap:wrap;align-items:center} .countdown{font-variant-numeric:tabular-nums} .tip{font-size:13px;line-height:1.5} @media(max-width:400px){.grid{grid-template-columns:1fr}}
</style></head><body><main><header><strong>☀️ Morning Missions</strong><button id="logout" class="secondary hidden">Sign out</button></header><div id="root"></div></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const CONFIG={url:'https://hssyizylmctwmcsecrea.supabase.co',key:'sb_publishable_fhhX2IOIHktrj_lyKBvZZg_XgQ9v9jy'};
const root=document.querySelector('#root'),logout=document.querySelector('#logout');
let sb=null,user=null,profile=null,children=[],tasks=[],checks=[],history=[],channel=null,clockInterval=null;
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateKey=()=>{let parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());let x=Object.fromEntries(parts.map(p=>[p.type,p.value]));return `${x.year}-${x.month}-${x.day}`};
const nyTime=()=>new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'2-digit',hour12:false}).format(new Date());
const weekday=()=>{const d=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short'}).format(new Date());return !['Sat','Sun'].includes(d)};
const countdown=()=>{let [h,m]=nyTime().split(':').map(Number);if(h===24)h=0;let mins=7*60+15-(h*60+m);return mins>0?`${Math.floor(mins/60)}h ${mins%60}m until 7:15`:'7:15 departure time has passed';};
const setError=e=>{const n=document.querySelector('#message');if(n)n.textContent=e?.message||String(e)};
const configured=()=>CONFIG.url.startsWith('https://')&&CONFIG.key.length>30;
async function init(){if(!configured()){root.innerHTML='<div class="card"><h1>Setup needed 🛠️</h1><p>Follow the included README to connect your private Supabase project. Then publish the app.</p></div>';return}sb=createClient(CONFIG.url,CONFIG.key,{auth:{persistSession:true,autoRefreshToken:true}});sb.auth.onAuthStateChange(()=>setTimeout(load,0));await load()}
async function load(){try{if(channel){await sb.removeChannel(channel);channel=null}let r=await sb.auth.getUser();user=r.data.user;if(!user){profile=null;logout.classList.add('hidden');showLogin();return}logout.classList.remove('hidden');let p=await sb.from('profiles').select('*').eq('id',user.id).single();if(p.error)throw new Error('Account not linked to a family profile. Ask the parent to finish setup. '+p.error.message);profile=p.data;await refresh();channel=sb.channel('family-live-'+user.id).on('postgres_changes',{event:'*',schema:'public',table:'completions'},()=>refresh()).on('postgres_changes',{event:'*',schema:'public',table:'tasks'},()=>refresh()).subscribe()}catch(e){root.innerHTML=`<div class="card"><p class="error">${escapeHtml(e.message)}</p><button class="secondary" id="retry">Retry</button></div>`;document.querySelector('#retry').onclick=load}}
function showLogin(){root.innerHTML=`<div class="card"><h1>Welcome back! 🌈</h1><p class="muted">Sign in to your own morning checklist.</p><form id="login"><label>Email</label><input id="email" type="email" required autocomplete="username"><label>Password</label><input id="password" type="password" required autocomplete="current-password"><button class="primary" type="submit">Let's go!</button><p id="message" class="error" role="alert"></p></form><p class="tip muted">A parent sets up each family account. No public registration.</p></div>`;document.querySelector('#login').onsubmit=async e=>{e.preventDefault();let btn=e.target.querySelector('button');btn.disabled=true;let r=await sb.auth.signInWithPassword({email:document.querySelector('#email').value,password:document.querySelector('#password').value});btn.disabled=false;if(r.error)setError(r.error);else await load()}}
async function refresh(){let family=profile.family_id;let [pr,ts,cs]=await Promise.all([sb.from('profiles').select('id,display_name,role,theme').eq('family_id',family),sb.from('tasks').select('*').eq('family_id',family).order('sort_order'),sb.from('completions').select('*').eq('family_id',family).gte('day',new Date(Date.now()-45*86400000).toISOString().slice(0,10))]);for(let r of [pr,ts,cs])if(r.error)throw r.error;children=pr.data.filter(x=>x.role==='child');tasks=ts.data;history=cs.data;checks=history.filter(x=>x.day===dateKey());render()}
function progress(child){let t=tasks.filter(x=>x.child_id===child.id&&x.active);let completed=t.filter(x=>checks.some(c=>c.task_id===x.id&&c.child_id===child.id));return {t,completed,n:completed.length,percent:t.length?Math.round(100*completed.length/t.length):0}}
function streak(child){let all=tasks.filter(t=>t.child_id===child.id&&t.active);if(!all.length)return 0;let today=dateKey(),n=0;let [y,m,d]=today.split('-').map(Number);let date=new Date(Date.UTC(y,m-1,d));for(let i=0;i<40;i++){let key=date.toISOString().slice(0,10),weekday=date.getUTCDay();if(weekday!==0&&weekday!==6){let done=all.every(t=>history.some(c=>c.task_id===t.id&&c.child_id===child.id&&c.day===key));if(done)n++;else if(key!==today)break;}date.setUTCDate(date.getUTCDate()-1)}return n}
function timerHtml(){return `<div class="pill countdown" id="timer">⏰ ${escapeHtml(countdown())}</div>`}
function render(){let isParent=profile.role==='parent';root.innerHTML=isParent?parentHtml():childHtml();bind();if(clockInterval)clearInterval(clockInterval);clockInterval=setInterval(()=>{let el=document.querySelector('#timer');if(el)el.textContent='⏰ '+countdown()},15000)}
function childHtml(){let p=progress(profile),isNorah=profile.theme==='playful';let stars=p.n;return `<div class="card ${isNorah?'norah':'vinny'}"><div class="wrap"><span class="pill">${isNorah?'🌈':'🎮'} ${escapeHtml(profile.display_name)}'s missions</span>${timerHtml()}</div><h1>${isNorah?'You’ve got this! ✨':'Level up your morning ⚡'}</h1><div class="big">${p.n}/${p.t.length} completed</div><div class="bar" aria-label="${p.percent}% complete"><div style="width:${p.percent}%"></div></div><p class="reward">${isNorah?'⭐':'🏆'} ${stars} stars today · ${p.percent}% XP · 🔥 ${streak(profile)}-day streak</p>${!weekday()?'<p class="muted">It’s the weekend! Your checklist is available for practice.</p>':''}</div><div class="card"><h2>${isNorah?'My morning missions 🦄':'Today’s quests'}</h2>${p.t.map(t=>{let done=p.completed.some(c=>c.task_id===t.id);return `<button class="task ${done?'done':''}" data-task="${t.id}" aria-pressed="${done}"><span class="emoji">${escapeHtml(t.emoji)}</span><span>${escapeHtml(t.title)}</span><span class="check">${done?'✅':'◯'}</span></button>`}).join('')||'<p>No tasks yet. Ask your parent to add some.</p>'}${p.t.length&&p.n===p.t.length?'<div class="card" style="background:#e6fff1;text-align:center"><div class="big">🎉 Mission complete!</div><p>Fantastic work! You’re ready for the day.</p></div>':''}</div><p class="muted tip">Tasks reset each day. Stars count completed tasks today.</p>`}
function parentHtml(){return `<div class="card"><div class="wrap"><span class="pill">👩‍👧‍👦 Parent view</span>${timerHtml()}</div><h1>Morning headquarters ☀️</h1><p class="muted">Live checklists for Vinny and Norah. Tap a child to see progress.</p></div>${children.map(ch=>{let p=progress(ch);return `<div class="card"><div class="wrap"><h2>${escapeHtml(ch.display_name)} ${ch.theme==='playful'?'🌈':'🎮'}</h2><span class="right pill">${p.n}/${p.t.length} · ${p.percent}%</span></div><div class="bar"><div style="width:${p.percent}%"></div></div><p>⭐ ${p.n} stars today · 🔥 ${streak(ch)}-day streak ${p.t.length&&p.n===p.t.length?'· 🎉 All done!':''}</p><div>${p.t.map(t=>`<div class="childrow">${checks.some(c=>c.task_id===t.id&&c.child_id===ch.id)?'✅':'⬜'} ${escapeHtml(t.emoji)} ${escapeHtml(t.title)}</div>`).join('')}</div><details><summary>Manage ${escapeHtml(ch.display_name)}’s tasks</summary><form class="addtask" data-child="${ch.id}"><label>New task</label><input name="title" placeholder="e.g. Put shoes on" required maxlength="80"><label>Emoji</label><input name="emoji" value="✨" maxlength="8"><button class="primary">Add task</button></form>${p.t.map(t=>`<button class="secondary delete" data-id="${t.id}">Remove ${escapeHtml(t.title)}</button>`).join(' ')}</details></div>`}).join('')||'<div class="card">No child profiles yet. Finish the setup instructions.</div>'}<div class="card"><h2>Family settings</h2><p class="tip">Tasks automatically appear fresh each calendar day in Eastern Time. Children sign in with their own accounts. Only the parent can edit tasks.</p><button id="refresh" class="secondary">Refresh now</button><p id="message" class="error" role="alert"></p></div>`}
function bind(){document.querySelectorAll('[data-task]').forEach(b=>b.onclick=async()=>{b.disabled=true;let id=b.dataset.task;let exists=checks.find(c=>c.task_id===id&&c.child_id===profile.id);let r=exists?await sb.from('completions').delete().eq('id',exists.id):await sb.from('completions').insert({family_id:profile.family_id,child_id:profile.id,task_id:id,day:dateKey()});if(r.error){alert(r.error.message);b.disabled=false}else await refresh()});document.querySelectorAll('.addtask').forEach(f=>f.onsubmit=async e=>{e.preventDefault();let ch=f.dataset.child;let r=await sb.from('tasks').insert({family_id:profile.family_id,child_id:ch,title:f.elements.namedItem('title').value.trim(),emoji:f.elements.namedItem('emoji').value.trim()||'✨',sort_order:tasks.filter(t=>t.child_id===ch).length+1});if(r.error)setError(r.error);else await refresh()});document.querySelectorAll('.delete').forEach(b=>b.onclick=async()=>{if(!confirm('Remove this task?'))return;let r=await sb.from('tasks').delete().eq('id',b.dataset.id);if(r.error)setError(r.error);else await refresh()});let btn=document.querySelector('#refresh');if(btn)btn.onclick=refresh}
logout.onclick=async()=>{await sb.auth.signOut();await load()};init();
</script></body></html>
